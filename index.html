<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolution — Tecnologia Funerária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --petroleo: #00556A;
    --petroleo-2: #076E86;
    --pistache: #8CB567;
    --ink: #041418;
    --ink-2: #082026;
    --paper: #FFFFFF;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--ink);
    font-family: 'Barlow', sans-serif;
    color: var(--paper);
    min-height: 100%;
  }

  body{
    background:
      radial-gradient(120% 90% at 50% -10%, var(--petroleo-2) 0%, var(--ink-2) 45%, var(--ink) 78%);
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .page{
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 56px 28px 64px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Linha contínua — o traço do infinito que se torna "e" — conecta toda a jornada de links */
  .thread{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.55;
    pointer-events: none;
  }

  .thread path{
    fill: none;
    stroke: url(#threadGradient);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-dasharray: 6 10;
    animation: dash 34s linear infinite;
  }

  @keyframes dash{
    to{ stroke-dashoffset: -600; }
  }

  .content{
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar-ring{
    width: 144px;
    height: 144px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 200deg, var(--petroleo) 0%, var(--pistache) 55%, var(--petroleo) 100%);
    box-shadow: 0 0 0 1px rgba(140,181,103,0.15), 0 18px 40px -14px rgba(0,0,0,0.65);
    opacity: 0;
    animation: rise 0.7s ease forwards;
  }

  .avatar-inner{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .avatar-inner svg{ width: 58%; height: 58%; }

  .brand-name{
    margin: 22px 0 2px;
    font-weight: 900;
    font-size: 24px;
    letter-spacing: 0.01em;
    text-align: center;
    opacity: 0;
    animation: rise 0.7s ease 0.08s forwards;
  }

  .brand-tag{
    font-weight: 500;
    font-size: 14px;
    color: rgba(255,255,255,0.68);
    text-align: center;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
    opacity: 0;
    animation: rise 0.7s ease 0.14s forwards;
  }

  .bio{
    font-weight: 400;
    font-size: 14.5px;
    line-height: 1.55;
    color: rgba(255,255,255,0.78);
    text-align: center;
    max-width: 340px;
    margin: 10px 0 34px;
    opacity: 0;
    animation: rise 0.7s ease 0.2s forwards;
  }

  .bio strong{
    color: var(--pistache);
    font-weight: 600;
  }

  .links{
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-btn{
    --delay: 0s;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    text-decoration: none;
    color: var(--paper);
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.55s ease forwards;
    animation-delay: var(--delay);
    transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }

  .link-btn:hover, .link-btn:focus-visible{
    transform: translateY(-2px);
    border-color: rgba(140,181,103,0.55);
    background: rgba(140,181,103,0.08);
  }

  .link-btn:focus-visible{
    outline: 2px solid var(--pistache);
    outline-offset: 2px;
  }

  .link-btn::before{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(140,181,103,0.16), transparent);
    transform: translateX(-120%);
    transition: transform 0.6s ease;
  }

  .link-btn:hover::before{ transform: translateX(120%); }

  .icon-wrap{
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--petroleo), var(--petroleo-2));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-wrap svg{
    width: 19px;
    height: 19px;
    stroke: var(--paper);
    fill: none;
  }

  .link-label{
    font-weight: 600;
    font-size: 15.5px;
    letter-spacing: 0.01em;
    flex: 1;
  }

  .link-arrow{
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    opacity: 0.5;
    stroke: var(--paper);
  }

  .video-card{
    width: 100%;
    padding: 16px 16px 16px;
    border-radius: 14px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.55s ease forwards;
    animation-delay: var(--delay);
  }

  .video-card-head{
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }

  .eyebrow-label{
    font-weight: 600;
    font-size: 15.5px;
    letter-spacing: 0.01em;
    color: var(--paper);
  }

  .video-frame{
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(140,181,103,0.25);
    background: #000;
  }

  .video-frame video{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .map-card{
    width: 100%;
    padding: 16px 16px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.55s ease forwards;
    animation-delay: var(--delay);
  }

  .map-card-head{
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }

  .map-frame{
    width: 100%;
    height: 170px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(140,181,103,0.25);
  }

  .map-open{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--paper);
    font-weight: 600;
    font-size: 13.5px;
    background: linear-gradient(135deg, var(--petroleo), var(--petroleo-2));
    transition: filter 0.25s ease, transform 0.25s ease;
  }

  .map-open:hover, .map-open:focus-visible{
    filter: brightness(1.12);
    transform: translateY(-1px);
  }

  .map-open:focus-visible{
    outline: 2px solid var(--pistache);
    outline-offset: 2px;
  }

  .footer{
    margin-top: 46px;
    text-align: center;
    opacity: 0;
    animation: rise 0.6s ease 0.9s forwards;
  }

  .footer .eyebrow{
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--pistache);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .footer .line{
    font-size: 12px;
    color: rgba(255,255,255,0.42);
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .thread path{ animation: none; }
    .avatar-ring, .brand-name, .brand-tag, .bio, .link-btn, .footer{
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
